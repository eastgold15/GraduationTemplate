services:
  jeecg-boot-postgres:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jeecgboot
      TZ: Asia/Shanghai
    restart: always
    container_name: jeecg-boot-postgres
    ports:
      - 5432:5432
    networks:
      - jeecg-boot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/其他数据库脚本/jeecgboot-postgresql17.sql:/docker-entrypoint-initdb.d/init.sql

  jeecg-boot-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    restart: always
    hostname: jeecg-boot-redis
    container_name: jeecg-boot-redis
    ports:
      - 6379:6379
    networks:
      - jeecg-boot

  # jeecg-boot-system:
#     restart: on-failure
#     depends_on:
#       - jeecg-boot-postgres
#       - jeecg-boot-redis
#     container_name: jeecg-boot-system
#     image: jeecg-boot-system
#     hostname: jeecg-boot-system
#     ports:
#       - 8080:8080
#     networks:
#       - jeecg-boot
#     volumes:
#       - ./config:/jeecg-boot/config

volumes:
  postgres_data:  # volumes 下只应该定义卷名称

networks:
  jeecg-boot:
    name: jeecg_boot
